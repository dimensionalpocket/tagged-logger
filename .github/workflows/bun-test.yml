name: Bun Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.ts"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.json"
      - ".tool-versions"
      - ".github/workflows/bun-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "index.ts"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.json"
      - ".tool-versions"
      - ".github/workflows/bun-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Bun version
        id: bun
        run: echo "version=$(awk '$1=="bun"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun fmt --check

      - name: Typecheck
        run: bun check

      - name: Test
        run: bun test
